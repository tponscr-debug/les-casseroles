<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Les Casseroles</title>
    <link rel="stylesheet" href="fonts-ext.css">
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <main class="ticket">
        <div class="c brand" id="brand">*** LA CASSEROLE ***</div>
        <div class="c meta" id="sub">Brasserie de la Transparence</div>
        <hr>
        <div class="row"><span id="lbl-page">NOMS SUR CETTE PAGE</span><b id="stat-page">—</b></div>
        <div class="row"><span id="lbl-total">DOSSIERS EN BASE</span><b id="stat-politicians">—</b></div>
        <p class="status"><span class="dot inactive" id="page-dot"></span><span id="page-text">Impression du ticket…</span></p>
        <hr>
        <button class="toggle-btn on" id="toggle-btn"><span class="toggle-indicator"></span><span id="toggle-label">Caisse ouverte</span></button>
        <div class="row site"><span id="lbl-site">CE SITE</span><b id="site-state">—</b></div>
        <p class="why" id="site-why"></p>
        <button class="site-btn" id="site-btn" hidden>Exclure ce site</button>
        <label class="opt" for="first-only"><input type="checkbox" id="first-only"><span>Un seul surlignage par nom et par page</span></label>
        <label class="opt" for="serious-mode"><input type="checkbox" id="serious-mode"><span>Mode sérieux (sans les blagues)</span></label>
        <hr>
        <div class="c meta" id="thanks">Revenez quand c'est prescrit.</div>
        <div class="c meta" id="freshness"></div>
        <div class="barcode" aria-hidden="true"></div>
        <div class="c reply"><a href="https://github.com/tponscr-debug/les-casseroles/issues/new" target="_blank" rel="noopener noreferrer">Signaler une erreur · droit de réponse</a></div>
    </main>
    <script src="js/copy.js"></script>
    <script src="popup.js"></script>
</body>
</html>
